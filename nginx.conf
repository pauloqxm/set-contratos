server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json text/csv image/svg+xml;

  location = /api/validar-token {
    access_log off;
    proxy_pass http://127.0.0.1:8081/validar;
    proxy_http_version 1.1;
    proxy_set_header X-Ata-Token $http_x_ata_token;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|jpg|jpeg|png|svg|ico|csv)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
